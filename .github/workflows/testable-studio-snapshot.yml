name: OrkiCAD AI - Web and Windows Tauri test snapshots

on:
  pull_request:
  push:
    branches:
      - feat/testable-web-tauri-snapshot
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build standalone local Web preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test shared CAD Core and Studio contracts
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Compile Web frontend
        working-directory: studio/frontend
        run: |
          npm install --no-audit --no-fund
          npm run check:version
          npm run build
      - name: Smoke test standalone localhost Web frontend
        run: |
          PYTHONPATH=core python studio/web_runner.py > /tmp/orkicad-web.log 2>&1 &
          echo $! > /tmp/orkicad-web.pid
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:8765/api/health
          curl --fail --silent --show-error http://127.0.0.1:8765/ > /tmp/orkicad-index.html
          grep -q '<div id="root">' /tmp/orkicad-index.html
          kill $(cat /tmp/orkicad-web.pid)
      - name: Stage self-contained static Web preview (local Python backend)
        run: |
          mkdir -p delivery/OrkiCAD-AI-Web/studio/frontend
          cp -R core delivery/OrkiCAD-AI-Web/
          cp -R studio/frontend/dist delivery/OrkiCAD-AI-Web/studio/frontend/
          cp studio/web_runner.py delivery/OrkiCAD-AI-Web/studio/
          cp Start-OrkiCAD-Web.ps1 pyproject.toml LICENSE NOTICE THIRD_PARTY_NOTICES.md delivery/OrkiCAD-AI-Web/
          cp docs/TEST_SNAPSHOT.md delivery/OrkiCAD-AI-Web/LEEME-PRUEBAS.md
      - uses: actions/upload-artifact@v4
        with:
          name: OrkiCAD-AI-Web-v0.0.1-DEV
          path: delivery/OrkiCAD-AI-Web/
          if-no-files-found: error
          retention-days: 14

  desktop-windows:
    name: Build experimental Windows Tauri installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build prerequisites for standalone local CAD worker
        shell: pwsh
        run: |
          python -m pip install -e . pyinstaller pillow
          python studio/build_brand_icon.py
          python -m PyInstaller --onefile --clean --noconfirm --name orkicad-worker --paths core studio/desktop_worker.py
          New-Item -ItemType Directory -Force studio/frontend/src-tauri/resources/orkicad-runtime | Out-Null
          Copy-Item dist/orkicad-worker.exe studio/frontend/src-tauri/resources/orkicad-runtime/
      - name: Smoke-test packaged token-protected local worker
        shell: pwsh
        run: |
          $env:ORKICAD_STUDIO_PORT = '8767'
          $env:ORKICAD_STUDIO_TOKEN = 'ci-worker-smoke'
          $proc = Start-Process -FilePath 'dist/orkicad-worker.exe' -PassThru
          $ok = $false
          try {
            for ($i=0; $i -lt 50; $i++) {
              Start-Sleep -Milliseconds 350
              try {
                $reply = Invoke-RestMethod -Uri 'http://127.0.0.1:8767/api/health' -Headers @{'X-OrkiCAD-Token'='ci-worker-smoke'} -TimeoutSec 2
                if ($reply.status -eq 'ok') { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw 'Packaged OrkiCAD worker failed health check' }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Install frontend and create Tauri test installer
        working-directory: studio/frontend
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm run check:version
          npm run tauri:build -- --config src-tauri/tauri.bundle.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: OrkiCAD-AI-Tauri-Windows-v0.0.1-DEV
          path: studio/frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

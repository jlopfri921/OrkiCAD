name: Native STEP - Windows Linux macOS

on:
  push:
    paths:
      - "core/orkicad_core/occt*.py"
      - "core/orkicad_core/feature_program.py"
      - "core/orkicad_core/geometry.py"
      - "core/orkicad_core/step_export.py"
      - "core/orkicad_core/studio_server.py"
      - "core/orkicad_core/ai_interpreter.py"
      - "core/orkicad_core/cloud_interpreter.py"
      - "tests/test_cloud_interpreter.py"
      - "studio/frontend/**"
      - "shared/ui/**"
      - "comfyui/orkicad_nodes/web/feature_viewport.js"
      - "scripts/sync_shared_ui.py"
      - "tests/test_shared_ui.py"
      - "tests/test_studio_server.py"
      - "core/orkicad_core/parts_catalog.py"
      - "tests/test_occt_integration.py"
      - "tests/test_feature_program.py"
      - ".github/workflows/occt-cross-platform.yml"
  pull_request:
  workflow_dispatch:

jobs:
  test-occt-step:
    name: OCCT STEP / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install portable CAD runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "cadquery-ocp>=7.9,<9"
      - name: Verify actual OCP availability
        run: python -c "import OCP; print('OCP loaded')"
      - name: Run feature grammar safety tests
        run: python -m unittest discover -s tests -p test_feature_program.py -v
      - name: Run native STEP round-trip tests
        run: python -m unittest discover -s tests -p test_occt_integration.py -v
      - name: Run core and workflow regression tests
        run: python -m unittest discover -s tests -p test_catalog_and_comfyui.py -v

  test-studio-web:
    name: Studio web shared-core API + React build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install shared Python core
        run: python -m pip install -e .
      - name: Test web Studio shared CAD API contracts
        run: python -m unittest discover -s tests -p test_studio_server.py -v
      - name: Test local and cloud provider JSON contracts
        run: python -m unittest discover -s tests -p test_cloud_interpreter.py -v
      - name: Check identical shared viewport sources
        run: python scripts/sync_shared_ui.py --check
      - name: Test shared UI parity
        run: python -m unittest discover -s tests -p test_shared_ui.py -v
      - name: Install Studio frontend dependencies
        working-directory: studio/frontend
        run: npm install --no-audit --no-fund
      - name: Type-check and build React frontend
        working-directory: studio/frontend
        run: npm run build

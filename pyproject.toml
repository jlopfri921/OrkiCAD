[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orkicad-core"
version = "0.0.1"
description = "Early-stage deterministic CAD core for the OrkiCAD AI ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "License pending selection; no redistribution grant implied"}
authors = [{name = "OrkiCAD AI contributors"}]
dependencies = []

[project.scripts]
orkicad = "orkicad_core.cli:main"

[tool.setuptools]
package-dir = {"" = "core"}

[tool.setuptools.packages.find]
where = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
